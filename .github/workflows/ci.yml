name: CI

on:
  pull_request:
    branches:
      - main
      - development

  push:
    branches:
      - main
      - development

jobs:
  test:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build Next.js
        run: npm run build

      - name: Build Docker image
        run: docker build -t makeascene-frontend:test .
